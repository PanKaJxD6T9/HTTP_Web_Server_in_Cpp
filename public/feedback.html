<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(180deg, #fff8ef 0%, #f2efe8 100%);
            color: #1f2933;
            padding: 24px;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 18px 42px rgba(31, 41, 51, 0.12);
        }

        h1 {
            margin-top: 0;
        }

        form {
            display: grid;
            gap: 16px;
        }

        label {
            display: grid;
            gap: 8px;
            font-weight: 600;
        }

        input, textarea, select, button {
            font: inherit;
        }

        input, textarea, select {
            padding: 12px 14px;
            border: 1px solid #d9e2ec;
            border-radius: 14px;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        button {
            width: fit-content;
            padding: 12px 20px;
            border: 0;
            border-radius: 999px;
            background: #c2410c;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>Feedback Form</h1>
        <p>This form posts to <code>/feedback</code> and gets saved to its own CSV file.</p>
        <form action="/feedback" method="post">
            <label>
                Name
                <input type="text" name="name" required>
            </label>
            <label>
                Rating
                <select name="rating" required>
                    <option value="">Choose one</option>
                    <option>Excellent</option>
                    <option>Good</option>
                    <option>Average</option>
                    <option>Needs work</option>
                </select>
            </label>
            <label>
                Feedback
                <textarea name="feedback" required></textarea>
            </label>
            <button type="submit">Send Feedback</button>
        </form>
    </main>
</body>
</html>
