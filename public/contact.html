<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        :root {
            color-scheme: light;
            --page: #f5f1ea;
            --card: #fffdf8;
            --ink: #1f2933;
            --muted: #52606d;
            --accent: #0f766e;
            --accent-soft: #d6f3ef;
            --border: #d9e2ec;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top, rgba(15, 118, 110, 0.18), transparent 32%),
                linear-gradient(180deg, #fcfaf5 0%, var(--page) 100%);
        }

        main {
            width: min(100%, 680px);
            background: var(--card);
            border: 1px solid rgba(15, 118, 110, 0.12);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(31, 41, 51, 0.14);
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 12px;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.05;
        }

        p {
            margin: 0 0 24px;
            color: var(--muted);
            line-height: 1.6;
        }

        form {
            display: grid;
            gap: 18px;
        }

        label {
            display: grid;
            gap: 8px;
            font-weight: 600;
        }

        input, textarea, button {
            font: inherit;
        }

        input, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #ffffff;
        }

        textarea {
            min-height: 144px;
            resize: vertical;
        }

        button {
            width: fit-content;
            padding: 14px 22px;
            border: 0;
            border-radius: 999px;
            background: var(--accent);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <span class="eyebrow">POST Demo</span>
        <h1>Submit a real HTML form to the C++ server.</h1>
        <p>This page now sends an <code>application/x-www-form-urlencoded</code> request to <code>/contact</code>, so the server handles both the form body and the response.</p>
        <form action="/contact" method="post">
            <label>
                Name
                <input type="text" name="name" placeholder="Ada Lovelace" required>
            </label>
            <label>
                Email
                <input type="email" name="email" placeholder="ada@example.com" required>
            </label>
            <label>
                Message
                <textarea name="message" placeholder="Tell the server something interesting." required></textarea>
            </label>
            <button type="submit">Send POST Request</button>
        </form>
    </main>
</body>
</html>
